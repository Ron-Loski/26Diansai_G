  <text x="558" y="150" class="en" fill="#56798D" font-size="10">Upp</text>
  <text x="739" y="145" class="en" fill="#6F91A3" font-size="12">mV</text>
  <text x="558" y="187" class="cn label">真有效值</text>
  <text x="558" y="205" class="en" fill="#56798D" font-size="10">TRUE RMS</text>
