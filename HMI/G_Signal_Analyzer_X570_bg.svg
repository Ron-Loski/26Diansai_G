<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="600" viewBox="0 0 800 480" preserveAspectRatio="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071422"/>
      <stop offset="1" stop-color="#0A1D2E"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B2538"/>
      <stop offset="1" stop-color="#102D42"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000814" flood-opacity=".45"/>
    </filter>
    <style>
      .cn{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}
      .en{font-family:"Segoe UI","Arial",sans-serif}
      .panel{fill:#0D2234;stroke:#1B4158;stroke-width:1}
      .grid{stroke:#1A3B50;stroke-width:1;opacity:.72}
      .axis{fill:#708A9A;font-size:11px}
      .label{fill:#8FA8B8;font-size:13px}
      .section{fill:#E7F4FB;font-size:17px;font-weight:600}
    </style>
  </defs>

  <rect width="800" height="480" fill="url(#bg)"/>
  <rect width="800" height="58" fill="url(#header)"/>
  <rect y="57" width="800" height="1" fill="#1A526B"/>
  <circle cx="27" cy="28" r="12" fill="#12B8B0"/>
  <path d="M20 29l5 5 10-13" fill="none" stroke="#EFFFFE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="48" y="29" class="cn" fill="#F0FAFF" font-size="21" font-weight="700">周期信号测量分析装置</text>
  <text x="48" y="47" class="en" fill="#71A0B9" font-size="10" letter-spacing="1.2">2026 TI CUP · G 题 · PERIODIC SIGNAL ANALYZER</text>
  <rect x="670" y="16" width="112" height="28" rx="14" fill="#0A3A3D" stroke="#1BC5B9"/>
  <circle cx="687" cy="30" r="4" fill="#35E7C6"/>
  <text x="698" y="35" class="cn" fill="#CFFFF8" font-size="13">实时测量</text>

  <g filter="url(#shadow)">
    <rect class="panel" x="16" y="74" width="496" height="222" rx="10"/>
    <rect class="panel" x="528" y="74" width="256" height="222" rx="10"/>
    <rect class="panel" x="16" y="312" width="496" height="152" rx="10"/>
    <rect class="panel" x="528" y="312" width="256" height="152" rx="10"/>
  </g>

  <text x="31" y="99" class="cn section">时域波形</text>
  <text x="110" y="98" class="en label">TIME DOMAIN</text>
  <rect x="369" y="83" width="61" height="25" rx="12.5" fill="#13404C" stroke="#1CC9B8"/>
  <text x="386" y="100" class="cn" fill="#D8FFFA" font-size="12">1 周期</text>
  <rect x="437" y="83" width="61" height="25" rx="12.5" fill="#102B3E" stroke="#2B566D"/>
  <text x="454" y="100" class="cn" fill="#8CA5B5" font-size="12">3 周期</text>

  <rect x="31" y="116" width="466" height="160" rx="4" fill="#071926" stroke="#173C51"/>
  <g class="grid">
    <path d="M31 148H497M31 180H497M31 212H497M31 244H497"/>
    <path d="M89 116V276M147 116V276M205 116V276M263 116V276M321 116V276M379 116V276M437 116V276"/>
  </g>
  <path d="M31 196H497" stroke="#2F657B" stroke-width="1"/>
  <text x="37" y="130" class="en axis">+U</text>
  <text x="37" y="271" class="en axis">−U</text>
  <text x="476" y="270" class="en axis">t</text>

