  <text x="174" y="336" class="en label">VOLTAGE SPECTRUM</text>
  <rect x="31" y="350" width="466" height="96" rx="4" fill="#071926" stroke="#173C51"/>
  <g class="grid">
    <path d="M31 374H497M31 398H497M31 422H497"/>
    <path d="M124 350V446M217 350V446M310 350V446M403 350V446"/>
  </g>
  <path d="M31 434H497" stroke="#2F657B" stroke-width="1"/>
