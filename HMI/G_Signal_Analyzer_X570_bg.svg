  <rect x="544" y="168" width="224" height="48" rx="6" fill="#0A1B29" stroke="#18455A"/>
  <rect x="544" y="223" width="224" height="48" rx="6" fill="#0A1B29" stroke="#18455A"/>
  <rect x="544" y="113" width="4" height="48" rx="2" fill="#22D3C5"/>
